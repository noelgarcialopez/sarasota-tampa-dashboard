  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px;}
  @media(min-width:700px){ .wrap{padding:28px 24px 60px;} }
  header{margin-bottom:16px;}
  h1{font-size:19px;font-weight:600;margin:0 0 4px;}
  @media(min-width:700px){ h1{font-size:22px;} }
  .subtitle{font-size:12.5px;color:var(--sub);line-height:1.5;}
  @media(min-width:700px){ .subtitle{font-size:13px;} }
  .updated{font-size:11px;color:var(--sub);margin-top:4px;}

  .loctabs, .cattabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:thin;}
  .loctabs::-webkit-scrollbar, .cattabs::-webkit-scrollbar{height:4px;}
  .loctab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-size:12.5px;cursor:pointer;color:var(--sub);white-space:nowrap;flex:none;}
  .loctab.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .cattabs{margin-bottom:18px;}
  .cattab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:11.5px;cursor:pointer;color:var(--sub);white-space:nowrap;flex:none;}
  .cattab.active{color:#fff;border-color:transparent;}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  @media(min-width:600px){ .grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .card .label{font-size:11px;color:var(--sub);margin-bottom:5px;}
  .card .value{font-size:18px;font-weight:600;}
  @media(min-width:600px){ .card .value{font-size:22px;} }

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  @media(min-width:700px){ .panel{padding:18px 20px;margin-bottom:20px;} }
  .panel h2{font-size:14px;font-weight:600;margin:0 0 4px;}
  @media(min-width:700px){ .panel h2{font-size:15px;} }
  .panel .sub{font-size:11.5px;color:var(--sub);margin-bottom:12px;line-height:1.5;}

  .best-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  @media(min-width:700px){ .best-grid{grid-template-columns:repeat(4,1fr);} }
  .best-card{border-radius:10px;padding:12px 14px;}
  .best-card .cname{font-size:12px;font-weight:600;margin-bottom:6px;}
  .best-card .winner{font-size:15px;font-weight:700;margin-bottom:2px;}
  .best-card .wscore{font-size:12px;opacity:0.85;}
  .best-card .tie{font-size:10.5px;margin-top:4px;opacity:0.8;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  th{text-align:left;color:var(--sub);font-weight:500;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .best{color:var(--teal);font-weight:600;}
  .worst{color:var(--red);font-weight:600;}

  canvas{max-width:100%;}
  .metric-block{margin-bottom:20px;}
  .metric-block:last-child{margin-bottom:0;}
  .metric-title{font-size:12.5px;font-weight:600;margin-bottom:8px;}
  .metric-row{display:flex;gap:14px;flex-wrap:wrap;}
  .metric-chart{flex:1 1 260px;min-width:240px;position:relative;height:170px;}
  .metric-table{flex:1 1 200px;min-width:180px;}
  .note{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.5;}

  .rec-box{border-radius:10px;padding:14px 16px;}
  .rec-row{display:flex;gap:8px;margin-bottom:8px;font-size:13px;line-height:1.5;}
  .rec-row:last-child{margin-bottom:0;}
  .rec-tag{flex:none;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:2px 8px;border-radius:20px;height:fit-content;white-space:nowrap;}
  .rec-tag.s{background:var(--teal-l);color:var(--teal);}
  .rec-tag.o{background:var(--red-l);color:var(--red);}
  .rec-tag.a{background:var(--navy-l);color:var(--navy);}
  .rec-tag.j{background:var(--gold-l);color:var(--gold);}
  .story{font-size:13px;line-height:1.7;color:var(--ink);}
  .metrics-mini{font-size:11.5px;color:var(--sub);margin-top:10px;}
</style>

function fmt(v, unit){
  if(v===undefined||v===null) return "—";
  if(unit==="usd") return "$"+Math.round(v).toLocaleString();
  if(unit==="pct") return (v*100).toFixed(1)+"%";
  if(unit==="score") return v.toFixed(2);
  return Math.round(v).toLocaleString();
}
function pct1(v){ return v===null||v===undefined ? "N/A" : (v*100).toFixed(1)+"%"; }

function bestPerCategory(){
  if(currentLoc!==REGION){
    document.getElementById("bestPerCategory").innerHTML = "";
    return;
  }
  const scoredCats = ["Protection is My Priority","They Say WOW","Make them LOVE us","I GOT This"];
  const cards = scoredCats.map(cat=>{
    const col = CATEGORY_MAP[cat].color;
    const entries = LOCS.map(l=>({l, v:Q3_SCORES[l] ? Q3_SCORES[l][cat] : null})).filter(e=>e.v!==null && e.v!==undefined);
    const maxV = Math.max(...entries.map(e=>e.v));
    const winners = entries.filter(e=>Math.abs(e.v-maxV)<0.0005).map(e=>e.l);
    return `
      <div class="best-card" style="background:var(--${col}-l)">
        <div class="cname" style="color:var(--${col})">${cat}</div>
        <div class="winner" style="color:var(--${col})">${winners[0]}</div>
        <div class="wscore" style="color:var(--${col})">${pct1(maxV)}${winners.length>1 ? " (Q3)" : " · Q3"}</div>
        ${winners.length>1 ? `<div class="tie" style="color:var(--${col})">Tied with ${winners.slice(1).join(", ")}</div>` : ""}
      </div>
    `;
  }).join("");
  document.getElementById("bestPerCategory").innerHTML = `
    <div class="panel">
      <h2>Best location per category</h2>
      <div class="sub">Q3 (July–August, finalized) category scores from the Categories &amp; QTR tab. Ties shown where locations are within rounding of each other.</div>
      <div class="best-grid">${cards}</div>
    </div>
  `;
}

function catPct(v){ return v===null||v===undefined ? "N/A" : (v*100).toFixed(1)+"%"; }
function rankClass(rank){ return rank===1 ? "best" : (rank===LOCS.length ? "worst" : ""); }
function changeClass(v){ return v>0 ? "best" : (v<0 ? "worst" : ""); }

function scoreTable(rows){
  const sorted = rows.slice().sort((a,b)=>a.rank-b.rank);
  return `
    <div class="table-scroll"><table>
      <thead><tr><th>Location</th>${CATQTR_COLS.map(c=>`<th>${c.label}</th>`).join("")}<th>Overall</th><th>Rank</th><th>Key driver</th><th>Lowest area</th></tr></thead>
      <tbody>${sorted.map(r=>`
        <tr>
          <td>${r.loc}</td>
          ${CATQTR_COLS.map(c=>`<td>${catPct(r[c.key])}</td>`).join("")}
          <td class="${rankClass(r.rank)}">${catPct(r.overall)}</td>
          <td class="${rankClass(r.rank)}">#${r.rank}</td>
          <td>${r.keyDriver||"—"}</td>
          <td>${r.lowest||"—"}</td>
        </tr>
      `).join("")}</tbody>
    </table></div>
  `;
}

function movementTable(rows){
  const sorted = rows.slice().sort((a,b)=>a.newRank-b.newRank);
  return `
    <div class="table-scroll"><table>
      <thead><tr><th>Location</th><th>Prior overall</th><th>New overall</th><th>Change</th><th>Prior rank</th><th>New rank</th><th>Direction</th><th>Strength</th><th>Opportunity</th></tr></thead>
      <tbody>${sorted.map(r=>`
        <tr>
          <td>${r.loc}</td>
          <td>${catPct(r.prevOverall)}</td>
          <td>${catPct(r.newOverall)}</td>
          <td class="${changeClass(r.change)}">${r.change>=0?"+":""}${(r.change*100).toFixed(1)} pts</td>
          <td>#${r.prevRank}</td>
          <td>#${r.newRank}</td>
          <td class="${r.direction==="Improved"?"best":(r.direction==="Declined"?"worst":"")}">${r.direction}</td>
          <td>${r.strength||"—"}</td>
          <td>${r.opportunity||"—"}</td>
        </tr>
      `).join("")}</tbody>
    </table></div>
  `;
}

function strengthWeaknessTable(rows){
  const sorted = rows.slice().sort((a,b)=>{
    const ra = parseInt(a.overallRank.split("#")[1]), rb = parseInt(b.overallRank.split("#")[1]);
    return ra-rb;
  });
  return `
    <div class="table-scroll"><table>
      <thead><tr><th>Location</th><th>Strength</th><th>Opportunity</th><th>Action focus</th><th>Claims</th><th>Claims $$$</th><th>OT hrs</th><th>Overall / Rank</th></tr></thead>
      <tbody>${sorted.map(r=>`
        <tr>
          <td>${r.loc}</td>
          <td title="${r.why}">${r.strength}</td>
          <td>${r.opportunity}</td>
          <td title="${r.signal}">${r.action}</td>
          <td>${r.claims}</td>
          <td>${fmt(r.claimsCost,"usd")}</td>
          <td>${r.ot}</td>
          <td>${r.overallRank}</td>
        </tr>
      `).join("")}</tbody>
    </table></div>
  `;
}

function septScoreTable(rows){

      <thead><tr><th>Location</th><th>Protection</th><th>They Say WOW</th><th>Make them LOVE us</th><th>I GOT This</th><th>Overall</th><th>Rank</th></tr></thead>

  const container = document.getElementById("categoryQtrDetail");

  const tabsHtml = QTR_SECTIONS.map(s=>
    `<div class="cattab${s.key===currentQtrSection?" active":""}" data-qtrkey="${s.key}" style="${s.key===currentQtrSection?"background:var(--navy);border-color:var(--navy);color:#fff;":""}">${s.title}</div>`

  else bodyHtml = strengthWeaknessTable(CATQTR[section.key]);

  container.innerHTML = `
    <div class="panel">
      <h2>Category &amp; quarter analysis — full Categories &amp; QTR tab</h2>

  if(currentLoc===REGION){
    document.getElementById("recommendation").innerHTML = `
      <div class="panel">
        <h2>Region recommendation</h2>
        <div class="sub">Synthesized from Q2→Q3 movement and category performance across all 4 locations.</div>
        <div class="rec-box" style="background:var(--navy-l)">
          <div class="story">${REGION_STORY}</div>
        </div>
      </div>
    `;
  } else {
    const r = RECS[currentLoc];
    document.getElementById("recommendation").innerHTML = `
      <div class="panel">
        <h2>${currentLoc} recommendation</h2>
        <div class="sub">Q3 (Jul-Aug) category performance and action focus, from the Categories &amp; QTR tab.</div>
        <div class="rec-box" style="background:var(--gray-l)">
          <div class="rec-row"><span class="rec-tag s">Strength</span><span>${r.strength} — leading Q3 category at ${r.strengthPct}.</span></div>
          <div class="rec-row"><span class="rec-tag o">Opportunity</span><span>${r.opportunity} — biggest Q3 gap.</span></div>
          <div class="rec-row"><span class="rec-tag a">Action</span><span>${r.action}</span></div>
          <div class="rec-row"><span class="rec-tag j">Q3</span><span>${r.overall}</span></div>
          <div class="rec-row"><span class="rec-tag j">Aug</span><span>${r.august}</span></div>
          <div class="metrics-mini">Q3 claims: ${r.claims} · Q3 claims $$$: ${fmt(r.claimsCost,"usd")} · Q3 overtime: ${r.ot} hrs</div>
        </div>
      </div>
    `;
  }
}

let charts = [];
function destroyCharts(){ charts.forEach(c=>c.destroy()); charts=[]; }

function metricBlock(name, idx){
  const unit = UNIT[name];
  const monthly = M[name].monthly[currentLoc];
  const ytd = M[name].ytd;
  const canvasId = "chart_"+idx;
  const showLine = monthly.some(v=>v!==null);
  const rankable = LOCS.map(l=>({l, v: ytd[l]})).filter(r=>r.v!==null && r.v!==undefined);
  let sorted = rankable.slice();
  sorted.sort((a,b)=>b.v-a.v);
  const tableRows = sorted.map((r,i)=>`<tr><td>${i+1}. ${r.l}</td><td>${fmt(r.v,unit)}</td></tr>`).join("");
  return `
    <div class="metric-block">
      <div class="metric-title">${name}${currentLoc!==REGION ? " — "+currentLoc+" · YTD "+fmt(ytd[currentLoc],unit) : ""}</div>
      <div class="metric-row">
        <div class="metric-chart">
          <canvas id="${canvasId}" role="img" aria-label="Monthly ${name} trend for ${currentLoc}, January through September 2026">${showLine ? monthly.filter(v=>v!==null).join(", ") : "No monthly data available"}</canvas>
        </div>
        <div class="metric-table table-scroll">
          <table><thead><tr><th>Rank (YTD)</th><th>Value</th></tr></thead><tbody>${tableRows || "<tr><td colspan=2>No data</td></tr>"}</tbody></table>
        </div>
      </div>
    </div>
  `;
}

function drawMetricChart(name, idx){
  const unit = UNIT[name];
  const canvas = document.getElementById("chart_"+idx);
  if(!canvas) return;
  const data = M[name].monthly[currentLoc];
  const regionData = M[name].monthly[REGION];
  const datasets = [{
    label: currentLoc, data, borderColor:"#0c447c", backgroundColor:"rgba(12,68,124,0.08)",
    borderWidth:2, pointRadius:3, spanGaps:true, tension:0.25, fill:currentLoc===REGION
  }];
  if(currentLoc!==REGION){
    datasets.push({label:"Region", data:regionData, borderColor:"#888780", borderWidth:1.5,
      borderDash:[4,4], pointRadius:0, spanGaps:true, tension:0.25, fill:false});
  }
  const c = new Chart(canvas, {
    type:"line",
    data:{ labels:MONTHS, datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:"index", intersect:false},
      plugins:{ legend:{display: currentLoc!==REGION, labels:{boxWidth:10,font:{size:11}}},
        tooltip:{ callbacks:{ label: ctx => ctx.dataset.label+": "+fmt(ctx.raw, unit) } } },
      scales:{
        y:{ grid:{color:"#e1e0d9"}, ticks:{font:{size:10}, callback: v => unit==="pct" ? (v*100).toFixed(0)+"%" : (unit==="usd" ? "$"+v.toLocaleString() : v) } },
        x:{ grid:{display:false}, ticks:{font:{size:10}} }
      }
    }
  });
  charts.push(c);
}

function render(){
  updateTabs();
  overviewCards();
  bestPerCategory();
  categoryQtrDetail();
  scoringMethodPanel();
  recommendationPanel();
  destroyCharts();
  const metrics = CATEGORY_MAP[currentCat].metrics;
  const col = CATEGORY_MAP[currentCat].color;
  document.getElementById("metricBlocks").innerHTML = `
    <div class="panel">
      <h2 style="color:var(--${col})">${currentCat}</h2>
      <div class="sub">${currentLoc===REGION ? "All 4 locations, monthly trend + YTD rank" : currentLoc+" vs region average, monthly trend"}</div>
      ${metrics.map((m,i)=>metricBlock(m,i)).join("")}
      <div class="note">Blank points mean no data was recorded that month (Westin Sarasota opened operations in Q2, so January–March are blank across its metrics). Per the source workbook, September is a partial month-to-date view — figures will shift as the month closes, and AVG NPS has not yet been reported for September at any location.</div>
    </div>
  `;
  metrics.forEach((m,i)=>drawMetricChart(m,i));
}

render();
</script>
</body>
</html>
